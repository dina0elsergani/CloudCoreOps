name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: app
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=80

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
      # Every overlay must render. This is the check that catches an overlay
      # being renamed or deleted out from under the Argo CD Applications.
      - name: Build every overlay
        run: |
          for overlay in k8s/overlays/*/; do
            echo "::group::$overlay"
            kustomize build "$overlay"
            echo "::endgroup::"
          done
      - name: Argo CD Application paths must exist
        run: |
          status=0
          for app in gitops/argo-cd/*.yaml; do
            path=$(grep -oP '(?<=path:\s).*' "$app" | tr -d ' ')
            if [ ! -d "$path" ]; then
              echo "::error file=$app::path '$path' does not exist"
              status=1
            fi
          done
          exit $status

  security:
    name: Security and policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

  terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'
      - name: Format check
        run: terraform fmt -check -recursive infra/
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.52.0
      - name: TFLint
        run: tflint --chdir=infra --recursive

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR requires an all-lowercase path; repository owners may contain capitals.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cloudcoreops" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      # Pull requests build but never push, so forks need no credentials at all.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
