apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudcoreops-prod

resources:
  - ../../base

images:
  - name: cloudcoreops
    newName: ghcr.io/dina0elsergani/cloudcoreops
    newTag: stable

replicas:
  - name: cloudcoreops-app
    count: 3

patches:
  - path: patch-env.yaml
  - path: ingress-tls.yaml
    target:
      kind: Ingress
      name: cloudcoreops-ingress
