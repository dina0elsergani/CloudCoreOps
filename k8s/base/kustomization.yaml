apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - rbac.yaml
  - service-monitor.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/name: cloudcoreops
      app.kubernetes.io/part-of: cloudcoreops
    # Selectors are immutable on an existing Deployment; leave them alone.
    includeSelectors: false
